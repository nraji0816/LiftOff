<html lang="en">
<head>

<meta name="description" content="Liftoff: name something in the category. Basic answers stay on the ground, niche answers launch your rocket to space. Daily Flight and Unlimited modes with a live leaderboard.">
<meta property="og:title" content="Liftoff">
<meta property="og:description" content="Basic answers stay on the ground. Niche answers go to space.">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Liftoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: the whole page is a live space scene on a fixed canvas. Game console (left), flight window with the rocket (center), leaderboard + stats (right) float over it as HUD glass. Single dark theme by design. */
:root{
  color-scheme:dark;
  --void:#04050D; --panel:rgba(8,11,28,.76); --line:rgba(130,155,255,.24);
  --ink:#E9ECFF; --muted:#8F98C6; --cyan:#5CE1FF; --thrust:#FF7A3D; --thrust-ink:#1A0800; --thrust-dk:#B8441A;
  --gold:#FFD166; --bad:#FF4D6D;
  --b1:#FF8A3D; --b2:#F5C842; --b3:#C9E04B; --b4:#7ED957; --b5:#2FBF5F; --b6:#3DFF8F; --miss:#FF4D4D;
  --f-pixel:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  --f-body:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.35}
#space{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.flash{position:fixed;inset:0;pointer-events:none;z-index:2;background:var(--bad);opacity:0}
.flash.go{animation:flash .45s ease-out}
.flash.gold{background:var(--gold)}
@keyframes flash{0%{opacity:.28}100%{opacity:0}}
/* focus mode: during a round, only the prompt floats above the rocket */
body.focus header.hud,body.focus .console,body.focus .side,body.focus .altbox{display:none}
body.focus .grid{grid-template-columns:minmax(0,1fr)}
body.focus .flightwin{position:relative;top:auto;order:0;height:calc(100dvh - 56px);min-height:540px}
.air{position:absolute;left:0;right:0;top:3%;margin:0 auto;width:min(720px,100%);padding:0 8px;display:none;flex-direction:column;align-items:center;gap:14px;text-align:center}
body.focus .air{display:flex}
.air-top{display:flex;gap:10px 16px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(4,8,24,.6);border:1px solid var(--line);padding:8px 14px;border-radius:2px}
.air-top .engines{margin:0}
.air-prompt{font-family:var(--f-body);font-weight:700;font-size:clamp(30px,5.2vw,60px);line-height:1.02;margin:0;text-transform:uppercase;text-wrap:balance;color:#FFFFFF;
  text-shadow:0 3px 0 rgba(6,12,40,.9),0 0 26px rgba(4,8,24,.6)}
.air .timer{width:min(520px,100%)}
.air form.answer{width:min(560px,100%)}
.air form.answer input{background:rgba(4,8,24,.78)}
.air .bounce{width:min(560px,100%);background:rgba(4,8,24,.82);text-align:left}
.air-hint{margin:0;font-size:14px;color:#FFFFFF;text-shadow:0 1px 3px rgba(0,0,0,.8);background:rgba(4,8,24,.45);padding:4px 10px;border-radius:2px}
.air-verdict{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(4,8,24,.72);border:1px solid var(--line);padding:14px 22px;border-radius:2px;animation:pop .22s ease-out}
.air-verdict.top{border-color:var(--gold);box-shadow:0 0 26px rgba(255,209,102,.3)}
.air-verdict.bad{border-color:var(--bad)}
.air-ans{font-weight:700;font-size:26px;overflow-wrap:anywhere}
.air-pts{font-family:var(--f-pixel);font-size:28px;line-height:1}
.air-note{margin:0;color:var(--muted);font-size:14px}
.livesrow{display:flex;align-items:center;gap:8px;margin-top:4px}
.livesrow .engines{margin:0}
.lnum{font-family:var(--f-pixel);font-size:9px;color:var(--muted)}
.timer.paused i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.secs.paused{color:var(--gold)}
.air-top .lives{display:inline-flex;align-items:center;gap:6px}
.air-top .lives b{font-family:var(--f-pixel);font-size:9px;font-weight:400}
.air-top .lives.last b{color:var(--bad)}
.air-top .lives.last .engine.on{animation:pulse .8s ease-in-out infinite alternate}
.air-top .alt{color:var(--ink)}
@keyframes pulse{to{background:var(--bad);border-color:var(--bad);box-shadow:0 0 12px var(--bad)}}
.air-bonus{font-family:var(--f-pixel);font-size:10px;color:var(--b4)}
.air-life{font-family:var(--f-pixel);font-size:10px;color:#7CFC7C}
.air-lost{font-family:var(--f-pixel);font-size:10px;color:var(--bad)}
/* points scale */
.scale{position:relative;padding-top:22px;width:100%}
.scale.compact{padding-top:0;width:min(560px,100%)}
.track{display:flex;height:22px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.scale.compact .track{height:16px;opacity:.9}
.seg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:.06em;min-width:0;overflow:hidden;color:#0A0D20}
.scale.compact .seg{font-size:8px}
.seg span{white-space:nowrap;overflow:hidden}
.seg.t1{background:var(--b1)}.seg.t2{background:var(--b2)}.seg.t3{background:var(--b3)}.seg.t4{background:var(--b4)}.seg.t5{background:var(--b5)}.seg.t6{background:var(--b6)}
.marker{position:absolute;top:18px;bottom:-4px;width:3px;margin-left:-1.5px;background:#FFFFFF;box-shadow:0 0 10px #FFFFFF}
.marker b{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-family:var(--f-pixel);font-size:9px;font-weight:400;background:#FFFFFF;color:#0A0D20;padding:3px 4px;border-radius:2px;white-space:nowrap}
.ticks{position:relative;height:12px;margin-top:4px}
.ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-pixel);font-size:7px;color:var(--muted)}
.ticks span.first{transform:none}.ticks span.last{transform:translateX(-100%)}
/* summaries */
.summary{display:flex;flex-direction:column;gap:14px}
.sum-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.sum-prompt{margin:0;font-weight:700;font-size:20px;text-transform:uppercase;text-wrap:balance}
.sum-hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);background:rgba(0,0,0,.35);padding:14px 16px;border-radius:2px}
.sum-hero.top{border-color:var(--gold);box-shadow:0 0 26px rgba(255,209,102,.2)}
.sum-hero.bad{border-color:var(--bad)}
.sum-ans{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.big-pts{font-family:var(--f-pixel);font-size:clamp(34px,5vw,48px);line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.sum-score .label{text-align:right;margin-top:8px}
.sum-miss{margin:0;color:var(--bad);font-weight:600}
.sum-zone{margin:0;font-weight:600;color:var(--cyan)}
.breakdown{display:grid;gap:8px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0}
.brow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px}
.brow b{font-family:var(--f-pixel);font-size:10px;font-weight:400;white-space:nowrap}
.brow.combo b{color:var(--b4)}
.brow.total{color:var(--cyan);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:rgba(0,0,0,.3);padding:10px 12px;border-radius:2px;min-width:0}
.tile .v{font-family:var(--f-pixel);font-size:15px;margin-top:8px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .v .engines{margin:0}
.tile .sub{font-size:12px;color:var(--muted);margin-top:6px}
.tile.last{border-color:var(--bad)}.tile.last .sub{color:var(--bad)}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.goals{display:grid;gap:10px}
.goal{display:grid;gap:6px}
.goal p{margin:0;font-size:13px;color:var(--muted)}
.goal p b{color:var(--ink)}
.goal .bar{height:8px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.goal .bar i{display:block;height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.goal.best .bar i{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.record{font-family:var(--f-pixel);font-size:11px;color:#0A0D20;background:var(--gold);padding:10px 12px;border-radius:2px;text-align:center;box-shadow:0 0 22px rgba(255,209,102,.45)}
.btn.big{font-size:13px;padding:16px 22px;width:100%}
.logbox{display:grid;gap:8px}
.howto{margin:0;padding-left:22px;display:grid;gap:6px}
.howto li::marker{font-family:var(--f-pixel);font-size:10px;color:var(--cyan)}
/* badges */
.badges-label{margin-top:16px;display:flex;justify-content:space-between}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-family:var(--f-pixel);font-size:7px;line-height:1.2;padding:6px 7px;border:1px dashed var(--line);color:#535C86;border-radius:2px}
.badge.on{border-style:solid;border-color:var(--b5);color:var(--b5);background:rgba(199,125,255,.12)}
.newbadges .badges{margin-top:8px}
/* pop-up banners */
.banner{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 20px;background:rgba(4,8,24,.9);border:2px solid var(--cyan);border-radius:3px;text-align:center;pointer-events:none;max-width:calc(100vw - 32px)}
.banner b{font-family:var(--f-pixel);font-size:14px;font-weight:400;color:var(--cyan)}
.banner span{font-size:14px}
.banner.combo{border-color:var(--b4)}.banner.combo b{color:var(--b4)}
.banner.life{border-color:#7CFC7C}.banner.life b{color:#7CFC7C}
.banner.record{border-color:var(--gold);box-shadow:0 0 30px rgba(255,209,102,.4)}.banner.record b{color:var(--gold)}
.banner.badge{border-color:var(--b5)}.banner.badge b{color:var(--b5)}
.banner.warn{border-color:var(--bad)}.banner.warn b{color:var(--bad)}
.banner.go{animation:bn 1.9s ease both}
.banner[hidden]{display:none}
body.focus .banner{top:auto;bottom:max(24px,env(safe-area-inset-bottom,0px))}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}10%{opacity:1;transform:translate(-50%,0) scale(1.04)}16%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.banner.go{animation:none}.air-top .lives.last .engine.on{animation:none}}
/* ---- page shell ---- */
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 16px}
.nav .mark{background:none;border:0;padding:0;cursor:pointer;font-size:clamp(20px,2.6vw,28px)}
.pages{display:flex;flex-wrap:wrap;gap:6px}
.pages button{font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;padding:10px 12px;background:transparent;border:1px solid transparent;border-radius:2px;color:var(--muted)}
.pages button:hover{color:var(--ink);border-color:var(--line)}
.pages button[aria-current="page"]{color:#04121A;background:var(--cyan)}
.pane{padding:22px;min-height:420px}
.grid{grid-template-columns:minmax(0,1.2fr) minmax(220px,.72fr) minmax(0,.9fr)}
body:not(.page-lobby):not(.page-results) .side{display:none !important}
body.page-leaderboard .grid,body.page-stats .grid,body.page-how .grid{grid-template-columns:minmax(0,1fr) 260px}
body.page-results .grid{grid-template-columns:minmax(0,1.2fr) minmax(220px,.72fr) minmax(0,.9fr)}
body.focus .nav,body.focus .pane,body.focus .side{display:none !important}
@media (max-width:1040px){
  body.page-lobby .grid,body.page-results .grid{grid-template-columns:minmax(0,1fr) 210px}
  body.page-leaderboard .grid,body.page-stats .grid,body.page-how .grid{grid-template-columns:minmax(0,1fr) 200px}
}
@media (max-width:680px){
  body.page-lobby .grid,body.page-results .grid,body.page-leaderboard .grid,body.page-stats .grid,body.page-how .grid{grid-template-columns:minmax(0,1fr)}
  body.page-leaderboard .flightwin,body.page-stats .flightwin,body.page-how .flightwin,body.page-results .flightwin{display:none}
  body.page-lobby .flightwin{height:220px}
  .pages button{padding:8px 9px;font-size:8px}
}
.page{display:flex;flex-direction:column;gap:14px}
.page-title{font-family:var(--f-pixel);font-size:clamp(16px,2.4vw,22px);line-height:1.3;margin:0}
.sub-title{font-family:var(--f-pixel);font-size:11px;margin:10px 0 0;color:var(--cyan)}
.lobby{display:flex;flex-direction:column;gap:16px}
.daily{display:flex;flex-direction:column;gap:12px;padding:18px;border:1px solid var(--gold);border-radius:3px;background:linear-gradient(160deg,rgba(255,209,102,.12),rgba(255,209,102,0) 60%)}
.daily-title{font-family:var(--f-pixel);font-size:clamp(16px,2.4vw,24px);line-height:1.25;margin:0;color:var(--gold);text-shadow:0 0 18px rgba(255,209,102,.35)}
.daily-done{display:flex;flex-direction:column;gap:8px}
.over-score.small{font-size:clamp(26px,4vw,36px)}
.streak{margin:0;font-size:14px}
.streak b{font-family:var(--f-pixel);font-size:10px;font-weight:400;color:var(--thrust)}
.mode-card{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.25)}
.mode-card h3{font-family:var(--f-pixel);font-size:12px;margin:8px 0 6px;line-height:1.3}
.mode-card > div{flex:1 1 260px;min-width:0}
.mode-card .vnote{margin:0}
.packs-wrap{display:flex;flex-direction:column;gap:8px}
.packs-wrap .vnote{margin:0}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pack{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.3)}
.pack b{font-family:var(--f-pixel);font-size:9px;font-weight:400;line-height:1.4;color:var(--cyan)}
.pack span{font-size:13px;color:var(--muted)}
.pack:hover{border-color:var(--cyan);background:rgba(92,225,255,.08)}
.btn.wide{width:100%;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn.big{width:auto;flex:1 1 200px}
.cells{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}
.cell{display:inline-block;width:20px;height:20px;border-radius:3px;background:var(--line)}
.cells.sm{gap:2px}.cells.sm .cell,.cell.sm{width:10px;height:10px;border-radius:2px}
.cell.m{background:var(--miss)}
.cell.t1{background:var(--b1)}.cell.t2{background:var(--b2)}.cell.t3{background:var(--b3)}.cell.t4{background:var(--b4)}.cell.t5{background:var(--b5)}
.cell.t6{background:var(--b6);box-shadow:0 0 8px rgba(61,255,143,.7)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lb .nm small .cells{margin-right:4px}
.lobby-toast:empty{display:none}
.lobby-toast{color:var(--gold)}
.lb-scroll{max-height:min(70vh,900px);overflow:auto;padding-right:4px}
.lb .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sharebox{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:2px;padding:10px;font:inherit}
.sharebox[hidden]{display:none}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.badge-card{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px dashed var(--line);border-radius:2px;color:#5D6690}
.badge-card b{font-family:var(--f-pixel);font-size:8px;font-weight:400;line-height:1.4}
.badge-card span{font-size:13px}
.badge-card.on{border-style:solid;border-color:var(--b5);color:var(--ink);background:rgba(199,125,255,.1)}
.badge-card.on b{color:var(--b5)}
.modes-list{margin:0;padding-left:18px;display:grid;gap:6px}
.sumpanel{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(600px,calc(100% - 16px));max-height:calc(100% - 24px);overflow:auto;padding:20px;z-index:2}
.sumpanel[hidden]{display:none}
.quit{font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;padding:6px 8px;background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.quit:hover{color:var(--bad);border-color:var(--bad)}
.transit{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:16px;
  padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--void);opacity:0;transition:opacity .25s}
.transit.show{opacity:1}
.transit[hidden]{display:none}
.transit canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tr-top,.tr-bot{position:relative;z-index:1;background:rgba(4,8,24,.66);border:1px solid var(--line);border-radius:3px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tr-top{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 26px;text-align:center}
.tr-round{font-family:var(--f-pixel);font-size:clamp(24px,5vw,44px);line-height:1;text-shadow:0 0 18px rgba(92,225,255,.5)}
.tr-next{font-weight:600;color:var(--cyan)}
.tr-count{font-family:var(--f-pixel);font-size:clamp(40px,9vw,80px);line-height:1;color:var(--thrust);text-shadow:0 0 24px rgba(255,122,61,.6);min-height:1em}
.tr-bot{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:center;padding:12px 18px}
.tr-bot b{display:block;font-family:var(--f-pixel);font-size:12px;font-weight:400;margin-top:6px}
.tr-bot .btn{padding:10px 14px;font-size:9px}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* HUD glass with corner brackets */
.glass{
  background:
    linear-gradient(var(--cyan),var(--cyan)) top left/14px 2px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) top left/2px 14px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) top right/14px 2px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) top right/2px 14px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) bottom left/14px 2px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) bottom left/2px 14px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) bottom right/14px 2px no-repeat,
    linear-gradient(var(--cyan),var(--cyan)) bottom right/2px 14px no-repeat,
    var(--panel);
  border:1px solid var(--line);border-radius:3px;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  box-shadow:0 12px 40px rgba(0,0,0,.45);min-width:0}

// Mix categories so the same one never comes up twice in a row.

const SEEN_KEY = "lo-seen";
const seenAll = () => { const a = ls.get(SEEN_KEY, []); return Array.isArray(a) ? a : []; };

const PROMPT_STYLE = `Style: everyday, party game categories anyone understands instantly. NOT academic or nerdy trivia: no chemical elements, moons, bones, dates, capitals, or textbook lists.
Make each one specific enough that not everything goes: roughly 25 to 80 valid answers, with a clear yes or no for any answer. Good: "Name a cereal with a cartoon mascot", "Name a sport played on ice", "Name something in a junk drawer", "Name a streaming service". Too loose: "Name a food", "Name something red".
Vary the wording across prompts: mix "Name a …", "Name something you …", "Name a famous …", "Name something people …", and "Name a … that …". Aim for prompts people haven't heard before, not the usual party-game staples.
Each needs obvious answers most people would say first AND specific, regional, or insider picks that would impress a friend.
Rules: starts with "Name a", "Name an" or "Name something"; no real private people; under 70 characters.`;

async function refill(wait){
  if (S.mode === "daily") return;
  if (S.queue.length >= 3) return;
  if (!S.ranked) { S.queue.push(...offlineBatch()); return; }
  if (!fetching){
    fetching = api("prompts", {runId: S.runId, avoid: [...seenAll().slice(-60), ...S.seen.slice(-20)]})
      .then(j => { const f = fresh(j.prompts || []); if (!f.length) throw {code:"all_seen"}; S.queue.push(...interleave(shuffle(f), lastCategory())); })
      .catch(() => { S.queue.push(...offlineBatch()); })
      .finally(() => { fetching = null; });
  }
  if (wait || !S.queue.length) await fetching;
}

// The server decides every score. It returns the verdict plus the flight's new state.
async function judgeServer(ans){

  if (j.status === "bounce") return {bounce:true, kind:j.kind, suggestion:j.suggestion};

async function submit(ans){
  if (S.phase !== "play") return;
  const key = squash(ans);
  if (!key) return;
  const prev = S.bounced[key];
  // A repeat of something the judge or the offline book already bounced gets the same answer instantly.
  if (prev && prev.src !== "list") { S.bounce = prev; SFX.deny(); renderAll(); refocus(); return; }
  let v = null;
  if (!S.ranked) v = S.current.book ? judgeOffline(ans) : {valid:false, note:"Not on the list for this one."};
  else if (!prev && S.current.list){ const lv = judgeList(ans, S.current.list); if (lv && lv.bounce) v = lv; }
  if (v && v.bounce) return bounce(ans, key, v, S.ranked ? "list" : "book");
  SFX.lock();
  if (v) return finish(ans, v);
  S.phase = "judging"; S.pending = ans; S.bounce = null; renderAll();
  try { v = await judgeServer(ans); }
  catch(e){ v = {valid:false, error:true, note:"The judge didn't answer. This round doesn't count against you."}; }
  if (S.phase !== "judging") return;
  if (v.bounce){
    if (S.expired) return finish(null);

const CREATURES = (() => {
  const rnd = seeded("liftoff-sky"), out = [];

function drawCreatures(c, t, W, H, yOf, k){
  const span = W + 240;
  for (const o of CREATURES){
    const y0 = yOf(o.a); if (y0 < -90 || y0 > H + 90) continue;
    const x = (((o.x*span + o.vx*t) % span) + span) % span - 120, flip = o.vx < 0, dir = flip ? -1 : 1;
    switch (o.t){
      case "bird":
        for (let i=0;i<o.n;i++){
          const fr = Math.floor(t*6 + i*1.7) % 2 ? SPR.bird1 : SPR.bird2;
          const rank = Math.ceil(i/2), side = i%2 ? 1 : -1;
          sprite(c, fr, PAL.bird, x - dir*rank*9*k, y0 + side*rank*5*k + Math.sin(t*2 + i)*2, k*.8, false);
        }
        break;
      case "balloon": sprite(c, SPR.balloon, PAL.balloon, x, y0 + Math.sin(t*.8 + o.x*9)*3, k*1.1, false); break;
      case "plane":
        c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = k*1.2;
        c.beginPath(); c.moveTo(x - dir*9*k, y0); c.lineTo(x - dir*(9*k + 220), y0); c.stroke();
        sprite(c, SPR.plane, PAL.plane, x, y0, k, flip); break;
      case "jet":
        c.strokeStyle = "rgba(255,255,255,.45)"; c.lineWidth = k*.8;
        c.beginPath(); c.moveTo(x - dir*6*k, y0); c.lineTo(x - dir*(6*k + 300), y0); c.stroke();
        sprite(c, SPR.jet, PAL.jet, x, y0, k, flip); break;
      case "wballoon": sprite(c, SPR.wballoon, PAL.wballoon, x, y0 + Math.sin(t*.6)*2, k, false); break;
      case "sat": case "station":
        sprite(c, SPR.sat, Math.sin(t*4 + o.x*20) > 0 ? PAL.satOn : PAL.satOff, x, y0, o.t === "station" ? k*1.8 : k, false); break;
      case "astro":
        c.save(); c.translate(x, y0 + Math.sin(t*.7)*4); c.rotate(t*.35 + o.x*6);
        sprite(c, SPR.astro, PAL.astro, 0, 0, k, false); c.restore(); break;
      case "ufo": {
        const y = y0 + Math.sin(t*2 + o.x*10)*5;
        if (Math.sin(t*.7 + o.x*10) > .55){
          c.fillStyle = "rgba(124,252,124,.16)";
          c.beginPath(); c.moveTo(x - 4*k, y + 3*k); c.lineTo(x + 4*k, y + 3*k); c.lineTo(x + 12*k, y + 34*k); c.lineTo(x - 12*k, y + 34*k); c.closePath(); c.fill();
        }
        sprite(c, SPR.ufo, Math.floor(t*3) % 2 ? PAL.ufoOn : PAL.ufoOff, x, y, k, false); break;
      }
      case "alien": sprite(c, Math.floor(t*2.5 + o.x*7) % 2 ? SPR.alien1 : SPR.alien2, PAL.alien, x, y0 + Math.sin(t*1.3 + o.x*5)*6, k, false); break;
      case "kite": {
        const y = y0 + Math.sin(t*1.6 + o.x*9)*6;
        c.save(); c.translate(x, y); c.rotate(Math.sin(t*1.2 + o.x*5)*.25); sprite(c, SPR.kite, PAL.kite, 0, 0, k, false); c.restore(); break;
      }
      case "heli": sprite(c, Math.floor(t*14) % 2 ? SPR.heli1 : SPR.heli2, PAL.heli, x, y0 + Math.sin(t*2 + o.x*7)*3, k, flip); break;
      case "blimp": sprite(c, SPR.blimp, PAL.blimp, x, y0 + Math.sin(t*.5 + o.x*4)*4, k*1.3, flip); break;
      case "asteroid":
        c.save(); c.translate(x, y0); c.rotate(t*(.2 + o.x*.6) * dir); sprite(c, SPR.asteroid, PAL.asteroid, 0, 0, k*(1 + o.x), false); c.restore(); break;
      case "junk":
        c.save(); c.translate(x, y0); c.rotate(t*1.5*dir); sprite(c, SPR.junk, PAL.junk, 0, 0, k, false); c.restore(); break;
      case "meteor": {
        const ph = ((t*.35 + o.x*7) % 1); if (ph > .4) break;
        const mx = o.x*W + ph*W*.9*dir, my = y0 + ph*120;
        const mg = c.createLinearGradient(mx, my, mx - dir*120, my - 50);
        mg.addColorStop(0, "rgba(255,240,200,.95)"); mg.addColorStop(1, "rgba(255,160,90,0)");
        c.strokeStyle = mg; c.lineWidth = 2.5; c.beginPath(); c.moveTo(mx, my); c.lineTo(mx - dir*120, my - 50); c.stroke(); c.lineWidth = 1;
        c.fillStyle = "#FFF6DA"; c.fillRect(mx - 2, my - 2, 4, 4); break;
      }
      case "aurora":
        for (let b=0;b<3;b++){
          c.beginPath();
          for (let ax=0; ax<=W+24; ax+=24){ const yy = y0 + Math.sin(ax*.007 + t*.5 + b*1.9 + o.x*6)*22 + b*16; ax === 0 ? c.moveTo(ax, yy) : c.lineTo(ax, yy); }

      case "planet": {
        const pr = 18*k, [c1,c2] = PLANET_COL[o.hue % PLANET_COL.length], px = o.x*W;
        const pg = c.createRadialGradient(px - pr*.4, y0 - pr*.4, pr*.2, px, y0, pr); pg.addColorStop(0, c1); pg.addColorStop(1, c2);
        c.fillStyle = pg; c.beginPath(); c.arc(px, y0, pr, 0, 6.29); c.fill();
        c.fillStyle = "rgba(0,0,0,.15)"; for (let i=-1;i<=1;i++){ c.fillRect(px - pr*.9, y0 + i*pr*.35 - pr*.06, pr*1.8, pr*.12); }
        break;
      }
      case "galaxy": {
        const gx = o.x*W;
        c.save(); c.translate(gx, y0); c.rotate(t*.04 + o.x*3);
        const core = c.createRadialGradient(0, 0, 0, 0, 0, 12*k); core.addColorStop(0, "rgba(255,240,220,.9)"); core.addColorStop(1, "rgba(200,170,255,0)");
        c.fillStyle = core; c.beginPath(); c.arc(0, 0, 12*k, 0, 6.29); c.fill();
        c.fillStyle = "rgba(220,205,255,.7)";
        for (let i=0;i<70;i++){ const an = i*.28, rr = i*.55*k; for (const sgn of [1,-1]) c.fillRect(Math.cos(an)*rr*sgn, Math.sin(an)*rr*.45*sgn, 1.6, 1.6); }
        c.restore(); break;
      }
      case "comet": {
        const tail = c.createLinearGradient(x, y0, x + 140, y0 - 50);
        tail.addColorStop(0, "rgba(190,230,255,.85)"); tail.addColorStop(1, "rgba(190,230,255,0)");

      }
    }
  }
}

function paintFlame(c, x, ny, sc, p, band, t){
  if (p < .02) return;
  const f = FLAME[band] || FLAME[2];
  const len = (14 + 170*p) * sc * (.9 + .08*Math.sin(t*41) + .05*Math.sin(t*73));
  const wid = (6 + 8*p) * sc;
  c.globalCompositeOperation = "lighter";
  const gr = c.createRadialGradient(x, ny + len*.25, 0, x, ny + len*.25, len*.95 + 20);
  gr.addColorStop(0, f.glow + (.35 + .35*p) + ")"); gr.addColorStop(1, f.glow + "0)");
  c.fillStyle = gr; c.beginPath(); c.arc(x, ny + len*.25, len*.95 + 20, 0, 6.29); c.fill();
  const og = c.createLinearGradient(0, ny, 0, ny + len);
  og.addColorStop(0, f.mid); og.addColorStop(1, f.glow + "0)");
  c.fillStyle = og; c.beginPath(); c.moveTo(x - wid, ny);
  c.quadraticCurveTo(x - wid*.7, ny + len*.55, x, ny + len); c.quadraticCurveTo(x + wid*.7, ny + len*.55, x + wid, ny); c.fill();
  const cg = c.createLinearGradient(0, ny, 0, ny + len*.5);
  cg.addColorStop(0, f.core); cg.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = cg; c.beginPath(); c.moveTo(x - wid*.45, ny);
  c.quadraticCurveTo(x - wid*.3, ny + len*.3, x, ny + len*.5); c.quadraticCurveTo(x + wid*.3, ny + len*.3, x + wid*.45, ny); c.fill();
  if (band >= 4 && p > .35){
    c.fillStyle = "rgba(255,255,255,.55)";
    for (let i=1;i<=3;i++){ c.beginPath(); c.ellipse(x, ny + len*(.16 + i*.15), wid*.32, wid*.18, 0, 0, 6.29); c.fill(); }
  }
  c.globalCompositeOperation = "source-over";
}

  const sway = o.still ? 0 : Math.sin(t*1.3) * (.035 - .025*Math.min(1, p));

  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); };
  size(); window.addEventListener("resize", size);

  const STARS = Array.from({length:240}, () => ({x:Math.random(), y:Math.random(), r:Math.random()<.85 ? .6+Math.random()*.7 : 1.3+Math.random()*.8, l:Math.floor(Math.random()*3), p:Math.random()*6.28}));
  const TREES = Array.from({length:26}, () => ({x:Math.random(), s:.8 + Math.random()*.6}));
  const CLOUDS = Array.from({length:30}, (_,i) => ({a:6 + i*4.5 + Math.random()*3, x:Math.random(), s:.6 + Math.random()*1}));
  const PAR = [.008, .022, .05], TPAR = [.12, .3, .65];
  const STREAKS = Array.from({length:44}, () => ({x:Math.random(), y:Math.random(), v:.6 + Math.random()*.9}));
  const PIX = '"Press Start 2P", monospace';
  const off = document.createElement("canvas"), octx = off.getContext("2d", {willReadFrequently:true});

  let R = {x:0, y:0, w:300, h:500, top:0, left:0, right:0, bottom:0}, ppp = 1.5, A = 0;
  const yOf = a => R.y - (a - A) * ppp;
  const rocketScale = () => clamp(R.w/170, .72, 1.2);

  function skywrite(text, band, kind){
    const fs = Math.round(clamp(R.w*.15, 22, 42));
    octx.font = `${fs}px ${PIX}`;
    const tw = Math.ceil(octx.measureText(text).width) + 4, th = fs + 6;
    off.width = tw; off.height = th;
    octx.font = `${fs}px ${PIX}`; octx.textBaseline = "top"; octx.fillStyle = "#fff";
    octx.fillText(text, 2, 3);
    const data = octx.getImageData(0,0,tw,th).data;
    const step = Math.max(2, Math.round(fs/9));
    const top = 22*rocketScale() + 34;
    const col = kind === "miss" ? "#FF4D6D" : BAND_COL[band-1];
    for (let y=0;y<th;y+=step) for (let x=0;x<tw;x+=step){
      if (data[(y*tw + x)*4 + 3] < 120) continue;
      spawn({k:"ink", x:x - tw/2 + (Math.random()-.5), a:A - (top + y)/ppp, vx:(Math.random()-.5)*6, vy:4+Math.random()*6,
             s:step*.9, life:0, delay:(x/tw)*.35, max:3.6 + Math.random()*.5, col});
    }
  }

  function frame(now){
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const r = win.getBoundingClientRect();
    R = {x:r.left + r.width/2, y:r.top + r.height*.7, w:r.width, h:r.height, top:r.top, left:r.left, right:r.right, bottom:r.bottom};
    ppp = Math.max(2.6, r.height/115);

    if (FX.dur > 0){
      const k = clamp((now - FX.t0)/(FX.dur*1000), 0, 1);
      const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
      FX.alt = FX.from + (FX.to - FX.from) * e;
      if (k >= 1) FX.dur = 0;
    }
    A = FX.alt;
    const zi = zoneIdx(A);
    if (zi > FX.lastZone){ FX.lastZone = zi; if (S.phase !== "idle") SFX.zone(); }
    if (S.round > 0 && S.phase !== "over" && S.prevBest > 0 && !S.recordHit && A > S.prevBest){
      S.recordHit = true; banner("NEW RECORD", "You just passed your best flight", "record"); SFX.best();
    }

    while (FX.pending.length){ const p = FX.pending.shift(); skywrite(p.text, p.band, p.kind); if (p.kind === "miss") missPuff(); }

    let pw = 0;
    if (now < FX.burnEnd){
      const k = (now - FX.burnStart)/(FX.burnEnd - FX.burnStart);
      pw = FX.power * Math.min(1, k/.08) * (k > .72 ? (1-k)/.28 : 1);
    }
    const flying = S.round > 0 && S.phase !== "over" && S.phase !== "idle";
    const idleP = flying ? .1 : 0;
    const p = Math.max(pw, idleP);
    const band = pw > idleP ? FX.band : 2;
    FX.misfire = Math.max(0, FX.misfire - dt*1.4);
    // Sense of speed: the scenery streaks past while the altitude gain stays the same.
    if (!reduceMotion){
      FX.travel += pw * 1500 * dt;
      FX.lift += (pw * Math.min(R.h*.16, 130) - FX.lift) * Math.min(1, dt*2.5);
      let n = pw * 46 * dt;
      while (n > 0){ if (Math.random() < n) FX.wisps.push({x:R.x + (Math.random()-.5)*Math.max(R.w*1.6, 300), y:-40 - Math.random()*80, v:700 + 1100*pw*Math.random() + 500*pw, r:8 + Math.random()*26, life:0, dust:A > 260}); n--; }
    }
    for (let i=FX.wisps.length-1;i>=0;i--){ const w = FX.wisps[i]; w.life += dt; w.y += w.v*dt; if (w.y > H + 80) FX.wisps.splice(i,1); }
    for (let i=FX.rings.length-1;i>=0;i--){ const g = FX.rings[i]; g.t += dt; if (g.t > 1.1) FX.rings.splice(i,1); }

    emit(dt, p, band, pw > idleP);
    step(dt);
    draw(now/1000, p, band);

    const kmNow = Math.round(A*KM);
    if (kmNow !== shownKm){ shownKm = kmNow; const s = kmNow.toLocaleString(); $("altKm").textContent = s + " KM"; }
    if (zi !== shownZone){ shownZone = zi; $("altZone").textContent = ZONES[zi].name.toUpperCase(); }
    if (document.hidden) setTimeout(() => requestAnimationFrame(frame), 300); else requestAnimationFrame(frame);
  }

  function missPuff(){
    const sc = rocketScale();
    for (let i=0;i<34;i++) spawn({k:"smoke", x:(Math.random()-.5)*30*sc, a:A - 6/ppp, vx:(Math.random()-.5)*90, vy:-20 + Math.random()*90,
      r:5+Math.random()*6, gr:22, life:0, max:1.2+Math.random()*1.1, col:"40,40,52", al:.7});
  }

  function emit(dt, p, band, burning){
    if (p <= 0 || reduceMotion) return;
    const f = FLAME[band] || FLAME[2], sc = rocketScale();
    let n = (burning ? 50 + 260*p : 14)*dt;
    const up = (FX.lift || 0)/ppp;
    while (n > 0){ if (Math.random() < n) spawn({k:"smoke", x:(Math.random()-.5)*10*sc, a:A + up - (8*sc + 20*p*sc)/ppp,
      vx:(Math.random()-.5)*(30 + 80*p), vy:70 + Math.random()*(90 + 220*p), r:(3 + Math.random()*3)*sc, gr:(12 + 30*p)*sc, life:0,
      max:1.2 + Math.random()*(1 + 1.6*p), col:f.smoke, al:.16 + .26*p}); n--; }
    if (burning){ let m = (40 + 260*p)*dt; while (m > 0){ if (Math.random() < m) spawn({k:"spark", x:(Math.random()-.5)*8*sc, a:A - 6*sc/ppp,
      vx:(Math.random()-.5)*120, vy:240 + Math.random()*420*p, r:1 + Math.random()*1.6, life:0, max:.18 + Math.random()*.32, col:f.spark}); m--; } }
  }

  function step(dt){
    for (let i=P.length-1;i>=0;i--){
      const q = P[i]; q.life += dt;
      if (q.life > (q.delay||0) + q.max){ P.splice(i,1); continue; }
      if (q.k === "ink"){
        const t = q.life - q.delay; if (t < 0) continue;
        if (t > q.max - 1.2){ q.x += q.vx*dt*3; q.a += q.vy*dt/ppp; q.s *= 1 + dt*.25; }
        continue;
      }
      const drag = q.k === "spark" ? 1.5 : 2.2;
      q.vx *= Math.max(0, 1 - drag*dt); q.vy *= Math.max(0, 1 - drag*dt);
      q.x += q.vx*dt; q.a -= q.vy*dt/ppp;
      if (q.k === "smoke") q.r += q.gr*dt*(1 - q.life/q.max*.5);
    }
  }

  function draw(t, p, band){
    const c = ctx;
    c.setTransform(dpr,0,0,dpr,0,0);
    let sx = 0, sy = 0;
    if (!reduceMotion){
      const sh = FX.misfire*5 + (p > .5 ? (p - .5)*4 : 0);
      if (sh > .2){ sx = (Math.random()-.5)*sh; sy = (Math.random()-.5)*sh; }
    }
    c.translate(sx, sy);

    // sky: a long, slow gradient from light blue at the ground to black space
    const aTop = A + R.y/ppp, aBot = A - (H - R.y)/ppp;
    const g = c.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgb(skyRGB(A + (aTop - A)*.45)));
    g.addColorStop(clamp(R.y/H, .05, .95), rgb(skyRGB(A)));
    g.addColorStop(1, rgb(skyRGB(A - (A - aBot)*.45)));
    c.fillStyle = g; c.fillRect(-10,-10,W+20,H+20);

    const neb = clamp((A - 650)/400, 0, 1);
    if (neb > 0){
      [[.2,.3,"170,80,255"],[.78,.62,"60,140,255"],[.55,.15,"255,90,170"]].forEach(([nx,ny,col]) => {
        const cy = ((ny*H + A*ppp*.02) % (H*1.4)) - H*.2, rr = Math.max(W,H)*.45;
        const ng = c.createRadialGradient(nx*W, cy, 0, nx*W, cy, rr);
        ng.addColorStop(0, `rgba(${col},${.16*neb})`); ng.addColorStop(1, `rgba(${col},0)`);
        c.fillStyle = ng; c.fillRect(0,0,W,H);
      });
    }

    const starA = clamp((A - 170)/230, 0, 1);
    if (starA > 0){
      for (const s of STARS){
        const y = ((s.y*H + A*ppp*PAR[s.l] + FX.travel*TPAR[s.l]) % H + H) % H;
        c.globalAlpha = starA * (.55 + .45*Math.sin(t*(1.4 + s.l) + s.p));
        c.fillStyle = s.p > 4 ? "#CFE0FF" : "#FFFFFF";
        const rr = s.r * (s.l === 2 ? 1.2 : 1);
        c.fillRect(s.x*W - rr/2, y - rr/2, rr, rr);
      }
      c.globalAlpha = 1;
    }

    const limb = clamp((A - 230)/90, 0, 1) * clamp((820 - A)/200, 0, 1);
    if (limb > 0){
      const ER = Math.max(W, H)*1.6, ly = H - 60 + Math.max(0, A - 280)*ppp*.02;
      c.globalAlpha = limb;
      const eg = c.createRadialGradient(W/2, ly + ER, ER*.96, W/2, ly + ER, ER*1.03);
      eg.addColorStop(0, "rgba(40,110,220,0)"); eg.addColorStop(.55, "rgba(90,175,255,.6)"); eg.addColorStop(1, "rgba(90,175,255,0)");
      c.fillStyle = eg; c.fillRect(0, ly - 60, W, H - ly + 60);
      c.fillStyle = "#123A7A"; c.beginPath(); c.arc(W/2, ly + ER, ER, 0, 6.29); c.fill();
      c.globalAlpha = 1;
    }

    { const y = yOf(520), mr = clamp(R.w*.2, 34, 70), mx = R.x + R.w*.32;
      if (y > -mr*2 && y < H + mr*2){
        const mg = c.createRadialGradient(mx, y, mr*.8, mx, y, mr*1.8); mg.addColorStop(0,"rgba(230,226,210,.18)"); mg.addColorStop(1,"rgba(230,226,210,0)");
        c.fillStyle = mg; c.beginPath(); c.arc(mx, y, mr*1.8, 0, 6.29); c.fill();
        c.fillStyle = "#DCD8CC"; c.beginPath(); c.arc(mx, y, mr, 0, 6.29); c.fill();
        c.fillStyle = "#B9B4A6";
        [[-.3,-.2,.22],[.25,.15,.16],[-.05,.38,.12],[.35,-.35,.09]].forEach(([dx,dy,rr]) => { c.beginPath(); c.arc(mx+dx*mr, y+dy*mr, rr*mr, 0, 6.29); c.fill(); });
      } }

    { const y = yOf(1150), pr = clamp(R.w*.16, 28, 56), px = R.x - R.w*.3;
      if (y > -pr*3 && y < H + pr*3){
        c.save(); c.translate(px, y); c.rotate(-.35);
        c.strokeStyle = "rgba(255,209,102,.55)"; c.lineWidth = 3; c.beginPath(); c.ellipse(0,0,pr*2,pr*.5,0,Math.PI,2*Math.PI); c.stroke();
        const pg = c.createLinearGradient(-pr,-pr,pr,pr); pg.addColorStop(0,"#C77DFF"); pg.addColorStop(1,"#4B2A8A");
        c.fillStyle = pg; c.beginPath(); c.arc(0,0,pr,0,6.29); c.fill();
        c.beginPath(); c.ellipse(0,0,pr*2,pr*.5,0,0,Math.PI); c.stroke();
        c.restore();
      } }

    // daytime clouds
    for (const cl of CLOUDS){
      const y = yOf(cl.a); if (y < -60 || y > H + 60) continue;
      const cx = (((cl.x*W + t*4*cl.s) % (W + 300)) + W + 300) % (W + 300) - 150, s = cl.s * clamp(W/900, .7, 1.4);
      c.fillStyle = "rgba(255,255,255,.88)";
      c.beginPath();
      c.ellipse(cx, y, 70*s, 16*s, 0, 0, 6.29);
      c.ellipse(cx-40*s, y+5*s, 44*s, 12*s, 0, 0, 6.29);
      c.ellipse(cx+36*s, y-7*s, 40*s, 17*s, 0, 0, 6.29);
      c.fill();
      c.fillStyle = "rgba(190,210,235,.6)";
      c.beginPath(); c.ellipse(cx, y+9*s, 64*s, 6*s, 0, 0, 6.29); c.fill();
    }

    const k = clamp(Math.min(W, 1400)/420, 2, 3.4);
    drawCreatures(c, t, W, H, yOf, k);
    { const sp = clamp((FX.lift || 0) / 90, 0, 1);
      if (sp > .03){
        c.fillStyle = "#FFFFFF";
        for (const s of STREAKS){
          const len = 30 + 260*sp*s.v, y = ((s.y*(H + len) + FX.travel*s.v) % (H + len)) - len;
          c.globalAlpha = (.06 + .3*sp) * s.v; c.fillRect(s.x*W, y, 1.5, len);
        }
        c.globalAlpha = 1;
      }
      for (const w of FX.wisps){
        if (w.dust){ c.globalAlpha = .7; c.fillStyle = "#DDE6FF"; c.fillRect(w.x, w.y, 2, 10 + w.v*.02); }
        else { c.globalAlpha = .55; c.fillStyle = "#FFFFFF"; c.beginPath(); c.ellipse(w.x, w.y, w.r*1.6, w.r*.7, 0, 0, 6.29); c.fill(); }
      }
      c.globalAlpha = 1; }

    // ground: hills, trees, pad and tower
    const gy = yOf(0) + 2;
    if (gy < H + 60){
      c.fillStyle = "#5E9A74"; c.beginPath(); c.moveTo(0, gy);
      for (let x=0;x<=W+20;x+=20) c.lineTo(x, gy - 16 - 12*Math.sin(x*.011) - 7*Math.sin(x*.029));
      c.lineTo(W, gy); c.closePath(); c.fill();
      c.fillStyle = "#3F7A4E"; c.fillRect(0, gy, W, H - gy + 20);
      c.fillStyle = "#336742"; c.fillRect(0, gy + 22, W, H - gy);
      for (const tr of TREES){ const tx = tr.x*W; if (Math.abs(tx - R.x) < 70) continue; sprite(c, SPR.tree, PAL.tree, tx, gy - 6*tr.s, k*tr.s, false); }
      const sc = rocketScale();
      c.fillStyle = "#4A5168"; c.fillRect(R.x - 34*sc, gy - 3, 68*sc, 5);
      c.strokeStyle = "#3A4360"; c.lineWidth = 2;
      const tx = R.x - 30*sc;
      c.beginPath(); c.moveTo(tx, gy); c.lineTo(tx, gy - 96*sc); c.stroke();
      for (let i=1;i<8;i++){ c.beginPath(); c.moveTo(tx-6, gy-i*12*sc); c.lineTo(tx+6, gy-i*12*sc+6); c.stroke(); }
      c.fillStyle = (Math.sin(t*3) > 0) ? "#FF4D6D" : "#7A1A2C"; c.fillRect(tx-2, gy-100*sc, 4, 4);
      c.lineWidth = 1;
    }

    // zone markers inside the flight window, dark on light sky and cyan on dark sky
    c.font = `8px ${PIX}`;
    for (const z of ZONES.slice(1)){
      const y = yOf(z.a); if (y < R.top + 90 || y > R.bottom) continue;
      const light = lum(skyRGB(z.a)) > .38;
      c.strokeStyle = light ? "rgba(8,24,60,.35)" : "rgba(92,225,255,.28)"; c.setLineDash([3,5]);
      c.beginPath(); c.moveTo(R.left, y); c.lineTo(R.right, y); c.stroke(); c.setLineDash([]);
      if (R.w >= 130){ c.fillStyle = light ? "rgba(8,24,60,.85)" : "rgba(92,225,255,.8)"; c.fillText(`${z.name.toUpperCase()} ${(z.a*KM).toLocaleString()}KM`, R.left + 8, y - 6); }
    }

    // your best and the top flight, as lines to chase
    const marks = [];
    if (S.prevBest > 0) marks.push({a:S.prevBest, label:"YOUR BEST " + km(S.prevBest) + "KM", col:"#FFD166"});
    const tb = topBest(); if (tb > 0 && tb > S.prevBest) marks.push({a:tb, label:"TOP FLIGHT " + km(tb) + "KM", col:"#FF7AB8"});
    for (const m of marks){
      const y = yOf(m.a); if (y < R.top + 40 || y > R.bottom) continue;
      c.strokeStyle = m.col; c.lineWidth = 2; c.setLineDash([10,6]);
      c.beginPath(); c.moveTo(R.left, y); c.lineTo(R.right, y); c.stroke(); c.setLineDash([]); c.lineWidth = 1;
      const tw = c.measureText(m.label).width;
      c.fillStyle = "rgba(4,8,24,.75)"; c.fillRect(R.right - tw - 14, y - 16, tw + 10, 13);
      c.fillStyle = m.col; c.fillText(m.label, R.right - tw - 9, y - 6);
    }

    // smoke + skywritten score
    for (const q of P){
      if (q.k === "spark") continue;
      const y = yOf(q.a), x = R.x + q.x;
      if (y < -40 || y > H + 40) continue;
      if (q.k === "ink"){
        const tt = q.life - q.delay; if (tt < 0) continue;
        c.globalAlpha = Math.min(1, tt/.12) * (tt > q.max - 1.2 ? Math.max(0, (q.max - tt)/1.2) : 1);
        c.fillStyle = "rgba(6,12,34,.55)"; c.fillRect(x - q.s/2 + 1.5, y - q.s/2 + 1.5, q.s, q.s);
        c.fillStyle = q.col; c.fillRect(x - q.s/2, y - q.s/2, q.s, q.s);
      } else {
        const kk = q.life/q.max;
        c.globalAlpha = q.al * (kk < .1 ? kk/.1 : 1 - (kk - .1)/.9);
        c.fillStyle = `rgb(${q.col})`;
        c.beginPath(); c.arc(x, y, q.r, 0, 6.29); c.fill();
      }
    }
    c.globalAlpha = 1;

    const bob = S.phase === "idle" ? 0 : Math.sin(performance.now()/420)*2;
    const rx = R.x + (FX.misfire ? Math.sin(performance.now()/14)*3*FX.misfire : 0), ry = R.y + bob - (FX.lift || 0), sc = rocketScale();
    for (const g of FX.rings){
      if (g.t < 0) continue;
      const k2 = g.t/1.1, rr = (20 + (90 + 240*g.big)*k2) * sc;
      c.strokeStyle = `rgba(255,255,255,${(1 - k2)*.75})`; c.lineWidth = (2 + 5*g.big)*(1 - k2);
      c.beginPath(); c.ellipse(rx, ry + 8*sc, rr, rr*.35, 0, 0, 6.29); c.stroke();
    }
    c.lineWidth = 1;
    if (p > .6){
      const va = (p - .6)/.4;
      c.fillStyle = `rgba(255,255,255,${.18*va})`; c.strokeStyle = `rgba(255,255,255,${.55*va})`;
      c.beginPath(); c.moveTo(rx - 36*sc, ry + 4*sc); c.quadraticCurveTo(rx, ry - 150*sc, rx + 36*sc, ry + 4*sc); c.closePath(); c.fill(); c.stroke();
    }
    paintFlame(c, rx, ry + 9*sc, sc, p, band, t);
    c.globalCompositeOperation = "lighter";
    for (const q of P){ if (q.k !== "spark") continue; c.globalAlpha = 1 - q.life/q.max; c.fillStyle = q.col; c.fillRect(R.x + q.x, yOf(q.a) - (FX.lift || 0), q.r*1.4, q.r*1.4); }
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    paintRocket(c, rx, ry, sc, {t, p, still: S.phase === "idle"});
  }
  requestAnimationFrame(frame);
}

// ---------- between-round launch screen ----------
const SPEED = Array.from({length:46}, () => ({x:Math.random(), y:Math.random(), v:.6 + Math.random()*.9, w:Math.random() < .2 ? 2 : 1}));
function playTransit(round){
  return new Promise(resolve => {
    const ov = $("transit"), cv = $("tcanvas"), c = cv.getContext("2d");
    const next = S.queue[0];
    $("trRound").textContent = "ROUND " + round;
    $("trNext").textContent = next ? "Next up: " + (next.category || "Mixed") : "Fueling up with fresh prompts…";
    $("trAlt").textContent = km(S.score) + " KM · " + ZONES[zoneIdx(S.score)].name.toUpperCase();
    const eng = $("trEng"); eng.replaceChildren();
    for (let i=0;i<LIVES;i++) eng.append(el("span",{class:"engine"+(i<S.lives?" on":""),"aria-hidden":"true"}));
    eng.setAttribute("aria-label", S.lives + " lives left");
    if (S.mode === "daily"){ eng.replaceChildren(el("span",{class:"lnum",text:`Round ${round} of ${DAILY_N}`})); eng.setAttribute("aria-label", `Round ${round} of ${DAILY_N}`); }
    $("trCount").textContent = "";
    ov.hidden = false; requestAnimationFrame(() => ov.classList.add("show"));
    const GO = reduceMotion ? 1.0 : 1.95, END = reduceMotion ? 1.5 : 3.15, beat = GO/3;
    const parts = [];
    let done = false, t0 = performance.now(), last = t0, shown = "";
    const onKey = e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape"){ e.preventDefault(); finish(); } };
    function finish(){
      if (done) return; done = true;
      document.removeEventListener("keydown", onKey);
      ov.classList.remove("show");
      setTimeout(() => { ov.hidden = true; resolve(); }, 260);
    }
    document.addEventListener("keydown", onKey);
    $("trSkip").onclick = () => { SFX.click(); finish(); };
    $("trSkip").focus();

    function frame(now){
      if (done) return;
      const t = (now - t0)/1000, dt = Math.min(.05, (now - last)/1000); last = now;
      const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
      if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
      c.setTransform(dpr,0,0,dpr,0,0);

      const label = t < beat ? "3" : t < beat*2 ? "2" : t < GO ? "1" : "GO!";
      if (label !== shown){ shown = label; $("trCount").textContent = label; if (label === "GO!") SFX.launch(); else SFX.tick(label === "1"); }

      const lift = Math.max(0, t - GO), A = S.score + lift*70;
      const g = c.createLinearGradient(0,0,0,H);
      g.addColorStop(0, rgb(skyRGB(A + 180))); g.addColorStop(1, rgb(skyRGB(A)));
      c.fillStyle = g; c.fillRect(0,0,W,H);

      const starA = clamp((A - 170)/230, 0, 1);
      const streak = lift > 0 ? Math.min(1, lift*1.6) : 0;
      for (const s of SPEED){
        const len = 2 + 170*streak*s.v;
        const y = ((s.y*H + lift*1500*s.v) % (H + len)) - len;
        c.globalAlpha = lift > 0 ? .25 + .45*s.v : starA*.8;
        c.fillStyle = starA > .4 ? "#FFFFFF" : "rgba(255,255,255,.85)";
        c.fillRect(s.x*W, y, s.w, len);
      }
      c.globalAlpha = 1;

      const sc = clamp(Math.min(W, H)/340, 1, 1.9);
      const shake = reduceMotion ? 0 : (t < GO ? (t/GO)*3 : 1.6);
      const rise = lift > 0 ? Math.pow(Math.min(1, lift/1.15), 2.1) * H*.95 : 0;
      const rx = W/2 + (Math.random()-.5)*shake, ry = H*.68 - rise + (Math.random()-.5)*shake;

      // launch pad + ground only on the first launch
      if (S.score === 0){
        const gy = H*.68 + 8*sc + rise*.15;
        c.fillStyle = "#3F7A4E"; c.fillRect(0, gy, W, H - gy);
        c.fillStyle = "#4A5168"; c.fillRect(W/2 - 40*sc, gy - 4, 80*sc, 6);
      }

      if (!reduceMotion){
        const n = (t < GO ? 70 : 200)*dt;
        for (let i=0;i<Math.ceil(n);i++) if (Math.random() < n - i) parts.push({x:rx + (Math.random()-.5)*20*sc, y:ry + 12*sc,
          vx:(Math.random()-.5)*(t < GO ? 320 : 140), vy:t < GO ? Math.random()*50 : 220 + Math.random()*260, r:6*sc, life:0, max:1.1 + Math.random()*.9});
        for (let i=parts.length-1;i>=0;i--){
          const q = parts[i]; q.life += dt; if (q.life > q.max){ parts.splice(i,1); continue; }
          q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= 1 - 1.4*dt; q.vy *= 1 - .8*dt; q.r += 30*sc*dt;
          c.globalAlpha = .5*(1 - q.life/q.max); c.fillStyle = "rgb(228,231,240)";
          c.beginPath(); c.arc(q.x, q.y, q.r, 0, 6.29); c.fill();
        }
        c.globalAlpha = 1;
      }

      const p = t < GO ? .1 + .25*(t/GO) + .06*Math.sin(t*30) : 1;
      paintFlame(c, rx, ry + 9*sc, sc, p, t < GO ? 2 : 4, t);
      paintRocket(c, rx, ry, sc, {t, p, still: S.phase === "idle"});

      if (t >= END) finish(); else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

function goNext(){
  if (runOver()) return endRun();
  S.phase = "transit"; renderAll();
  if (S.queue[0]) prepList(S.queue[0]);
  const fuel = S.queue.length ? Promise.resolve() : refill(true);
  fuel.then(() => { const n = S.queue[0]; if (n && !$("transit").hidden) $("trNext").textContent = "Next up: " + (n.category || "Mixed"); });
  Promise.all([playTransit(S.round + 1), fuel]).then(nextRound);
}

      el("div",null, el("div",{class:"label",text:"Badges"}), el("div",{class:"v",text:`${[...have].filter(id => BADGES.some(x => x.id === id)).length}/${BADGES.length}`}))),
    nameBox(st),

}
function leaderboardPane(){
  const w = el("div",{class:"page"});
  const body = el("div");
  const draw = () => { head.querySelector(".tabs").replaceWith(lbTabs(draw)); body.replaceChildren(...(S.lbKind === "today" ? [gridLegend()] : []), el("div",{class:"lb-scroll"}, leaderList(S.lbKind, Infinity)));
    const n = (LB.counts && LB.counts[S.lbKind]) || rowsFor(S.lbKind).length, live = online ? ` · ${n} ${n === 1 ? "pilot" : "pilots"} · updates live` : "";
    note.textContent = (S.lbKind === "today" ? `Today's Daily Flight · ${prettyDate(todayKey())} · resets in ${untilTomorrow()}` : S.lbKind === "best" ? "Each pilot's highest single flight" : "Every km each pilot has ever flown") + live; };
  const head = el("div",{class:"bhead"}, el("h2",{class:"page-title",text:"LEADERBOARD"}), lbTabs(() => draw()));
  const note = el("p",{class:"vnote"});

}
function statsPane(){
  const st = myStats(), have = earnedBadges();
  const w = el("div",{class:"page"});
  w.append(el("h2",{class:"page-title",text:"YOUR STATS"}));
  w.append(el("div",{class:"tiles four"},
    tile("Best flight", el("div",{class:"v",text:km(st.best)}), "km"),
    tile("All time", el("div",{class:"v",text:km(st.total)}), "km"),
    tile("Flights", el("div",{class:"v",text:String(st.runs||0)}), st.runs ? "avg " + km(Math.round((st.total||0)/st.runs)) + " km" : ""),
    tile("Daily streak", el("div",{class:"v",text:String(currentStreak(st))}), currentStreak(st) === 1 ? "day" : "days"),
    tile("Ultra niche", el("div",{class:"v",text:String(st.jackpots||0)}), "answers 91+"),
    tile("Best pick", el("div",{class:"v",text:String(st.bestPick||st.bestStreak||0)}), "out of 100"),
    tile("Best combo", el("div",{class:"v",text: st.bestCombo ? "x" + st.bestCombo : "–"}), "56+ in a row"),
    tile("Today", el("div",{class:"v",text: st.daily && st.daily.date === todayKey() ? km(st.daily.score) : "–"}), "daily km")));
  w.append(el("div",{class:"label badges-label",text:`Badges · ${[...have].filter(id => BADGES.some(x => x.id === id)).length} of ${BADGES.length}`}));
  w.append(el("div",{class:"badge-grid"}, ...[...BADGES].sort((a,b) => (have.has(b.id) ? 1 : 0) - (have.has(a.id) ? 1 : 0)).map(b => el("div",{class:"badge-card" + (have.has(b.id) ? " on" : "")}, el("b",{text:b.name.toUpperCase()}), el("span",{text:b.how})))));
  const recent = (st.recent || []);
  if (recent.length){
    w.append(el("div",{class:"label",text:"Recent flights"}));
    w.append(el("ul",{class:"recent"}, ...recent.map(r => { const when = new Date(r.at).toLocaleDateString(undefined,{month:"short",day:"numeric"});
      const mode = r.mode === "daily" ? "Daily" : "Unlimited";
      return el("li",null, el("span",{text:`${when} · ${mode} · ${r.races} rounds`}), el("b",{text:km(r.score) + " KM"})); })));
  }
  const f = el("form",{class:"handle",id:"handleForm"},
    el("label",{class:"label",for:"handleInput",style:"flex-basis:100%",text:"Board name"}),
    el("input",{id:"handleInput",maxlength:"20",placeholder:"Pick a name for the leaderboard",autocomplete:"off"}),
    el("button",{class:"btn ghost",type:"submit",text:"SAVE"}));
  f.querySelector("input").value = st.handle || "";
  f.addEventListener("submit", saveHandle);
  w.append(f, el("p",{class:"toast",id:"myToast",text:S.toastMsg || ""}));

function howPane(){
  const w = el("div",{class:"page"});
  w.append(el("h2",{class:"page-title",text:"HOW TO PLAY"}),
    el("ol",{class:"howto"},
      el("li",{text:"Name something in the category before the 25 second clock runs out."}),
      el("li",{text:"Every right answer scores 1 to 100 points. The more niche, the more it's worth."}),

      el("li",{text:"Unlimited flights give you 3 lives. A wrong answer or no answer costs one. An Ultra niche answer (91+) repairs one."}),
      el("li",{text:"Combo: answers scoring 56+ back to back add +10, then +20, then +30 bonus points."})),
    scaleBar(null),
    el("ul",{class:"rules"}, ...BANDS.map((b,i) => el("li",null, el("span",{class:"chip t"+(i+1),text:RANGES[i]}), el("span",null, el("b",{text:b.name + ". "}), document.createTextNode(b.blurb))))),
    el("h3",{class:"sub-title",text:"EXACT ANSWERS"}),
    el("p",{class:"vnote",text:"Answers must be real and spelled out in full. Capitals, punctuation, accents, spacing and plurals don't matter. A misspelled or shortened answer bounces back with one “Did you mean” correction, and the clock pauses until you start typing. A real answer that doesn't fit the category is a miss."}),
    el("h3",{class:"sub-title",text:"MODES"}),
    el("ul",{class:"modes-list"},
      el("li",null, el("b",{text:"Daily Flight. "}), document.createTextNode(`${DAILY_N} prompts, the same for everyone today. No lives. One attempt. Keep a daily streak going.`)),
      el("li",null, el("b",{text:"Unlimited. "}), document.createTextNode("Random prompts, every one from a different category. 3 lives. Play as much as you want."))),
    el("h3",{class:"sub-title",text:"ALTITUDE ZONES"}),

    el("h3",{class:"sub-title",text:"BADGES"}),
    el("div",{class:"badge-grid"}, ...BADGES.map(b => el("div",{class:"badge-card on"}, el("b",{text:b.name.toUpperCase()}), el("span",{text:b.how})))),
    el("div",{class:"actions"}, el("button",{class:"btn primary",type:"button",text:"BACK TO LOBBY",onclick:() => go("lobby")})));

function renderPane(){
  const pane = $("pane");
  if (S.page === "play"){ pane.replaceChildren(); return; }
  if (S.page === "lobby" && S.phase === "idle") S.prevBest = myStats().best || 0;
  const v = S.page === "lobby" ? lobbyPane() : S.page === "results" ? flightSummary() : S.page === "leaderboard" ? leaderboardPane() : S.page === "stats" ? statsPane() : howPane();
  pane.replaceChildren(v);
}
function renderSide(){
  const side = $("side");
  if (S.page === "lobby") side.replaceChildren(...lobbySide());
  else if (S.page === "results"){
    const kind = S.mode === "daily" ? "today" : "best";
    side.replaceChildren(el("section",{class:"board glass"}, el("div",{class:"bhead"}, el("h3",{text: kind === "today" ? "TODAY'S BOARD" : "TOP FLIGHTS"})), leaderList(kind, 8),
      el("button",{class:"btn ghost wide",type:"button",text:"FULL LEADERBOARD",onclick:() => { S.lbKind = kind; go("leaderboard"); }})));
  }
  else side.replaceChildren();
}
function renderSum(){
  const sp = $("sumPanel");
  if (S.page === "play" && S.phase === "result" && S.revealed && S.verdict){
    sp.hidden = false;
    const lg = renderLog(8, "This flight");
    sp.replaceChildren(roundSummary(), ...(lg ? [lg] : []));
    sp.scrollTop = 0;
  } else { sp.hidden = true; sp.replaceChildren(); }
}

// The play screen: just the prompt, floating above the rocket.
function renderAir(){
  const air = $("air"); air.replaceChildren();
  if (S.page !== "play") return;
  const c = S.current;
  if (S.phase === "transit" || S.phase === "loading" || !c){
    air.append(el("p",{class:"air-hint"}, el("span",{class:"spin","aria-hidden":"true"}), "Fueling up…"));
    return;
  }
  if (S.phase === "result" && S.revealed) return;
  const daily = S.mode === "daily";
  const quit = el("button",{type:"button",class:"quit",text:"END FLIGHT"});
  quit.addEventListener("click", () => {
    if (Date.now() - (S.quitArm || 0) < 3000){ endRun(); return; }
    S.quitArm = Date.now(); quit.textContent = "TAP AGAIN TO END";
    setTimeout(() => { if (quit.isConnected) quit.textContent = "END FLIGHT"; }, 3000);
  });
  const top = el("div",{class:"air-top"},
    el("span",{class:"cat",text:(daily ? `Daily ${S.round}/${DAILY_N}` : "Round " + S.round) + " · " + (c.category||"Mixed")}),
    daily ? null : el("span",{class:"lives" + (S.lives === 1 ? " last" : ""), "aria-label":livesText(S.lives)}, el("span",{class:"label",text:"Lives"}), engines(S.lives), el("b",{text:S.lives + " left"})),
    el("span",{class:"label alt",text:km(S.score) + " km"}));
  if (S.combo >= 1) top.append(el("span",{class:"chip t4",text:"COMBO x" + S.combo}));
  top.append(el("span",{class:"secs",id:"secs",text:Math.ceil(S.left)+"s"}), quit);
  air.append(top, el("h2",{class:"air-prompt",text:c.prompt}));
  if (S.phase === "result"){
    const v = S.verdict;
    air.append(el("div",{class:"air-verdict" + (!v.valid ? " bad" : v.tier === 6 ? " top" : "")},
      tierChip(v),
      el("div",{class:"air-ans",text: v.answer ? (v.valid ? v.canonical : v.answer) : "No answer"}),
      el("div",{class:"air-pts",text:(v.valid ? v.score : 0) + "/100"}),
      v.bonus ? el("div",{class:"air-bonus",text:`+${v.bonus} combo bonus`}) : null,
      v.repaired ? el("div",{class:"air-life",text:"Life repaired · " + livesText(S.lives)}) : null,
      !v.valid && !v.error && !daily ? el("div",{class:"air-lost",text:"Lost a life · " + livesText(S.lives)}) : null,
      v.note ? el("p",{class:"air-note",text:v.note}) : null));
    return;
  }
  air.append(el("div",{class:"timer",id:"timer"}, el("i")));
  const f = el("form",{class:"answer",autocomplete:"off"});
  const inp = el("input",{id:"ans",maxlength:"40",placeholder:"Your answer",autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":"Your answer"});
  const b = el("button",{class:"btn primary",type:"submit",text: S.phase==="judging" ? "CHECKING" : "FIRE"});
  if (S.phase === "judging"){ inp.disabled = true; b.disabled = true; }
  inp.value = S.pending || "";
  inp.addEventListener("input", () => { if (S.pauseUntil){ S.pauseUntil = 0; paintTimer(); } });
  f.append(inp,b);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const v = inp.value.trim();
    if (!v || S.phase !== "play") return;
    S.pending = v; submit(v);
  });
  air.append(f);
  if (S.bounce && S.phase === "play"){
    const bo = S.bounce;
    const box = el("div",{class:"bounce",role:"alert"});
    if (bo.suggestion){
      box.append(el("p",{class:"didyou"}, document.createTextNode("Did you mean "),
        el("button",{type:"button",class:"sug",text:"“" + bo.suggestion + "”",onclick:() => { SFX.click(); const i = $("ans"); if (i){ i.value = bo.suggestion; i.focus(); } }}),
        document.createTextNode("?")));
    } else {
      box.append(el("p",{class:"didyou"}, el("b",{text:"“" + bo.answer + "”"}), document.createTextNode(" is shortened. Write out the full name.")));
    }
    box.append(el("p",{class:"hint",text: bo.src === "list" ? "Spelling check. Clock paused until you type. Sure it's right? Fire it again and the judge will check." : "Clock paused until you type."}));
        air.append(box);
  }
  air.append(S.phase==="judging" ? el("p",{class:"air-hint"},el("span",{class:"spin","aria-hidden":"true"}),"Checking your answer. The clock is paused.")
                                 : scaleBar(null, true));
  paintTimer();
}

document.querySelectorAll(".pages button").forEach(b => b.addEventListener("click", () => go(b.dataset.page)));
$("homeBtn").addEventListener("click", () => go("lobby"));
function paintSound(){ const b = $("soundBtn"); b.setAttribute("aria-pressed", String(SFX.on)); b.textContent = SFX.on ? "SOUND ON" : "SOUND OFF"; }

boot();
